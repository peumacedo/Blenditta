version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: blenditta-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: blenditta
      POSTGRES_PASSWORD: blenditta
      POSTGRES_DB: blenditta_finance
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
